name: 🐍 Generate Snake Animation

on:
  schedule:
    # 每天 UTC 00:00 自动运行
    - cron: "0 0 * * *"
  workflow_dispatch: # 允许手动触发

jobs:
  generate:
    name: Generate Snake SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23B8431A&color_dots=%23F4EFE6,%23F4D7C7,%23F1B08B,%23E98757,%23B8431A
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF9568&color_dots=%23211F1C,%23473428,%237E4930,%23B8633C,%23FF9568
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
