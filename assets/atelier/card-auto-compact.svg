<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-labelledby="t"><title id="t">Plate 07 — Pi Auto Compact</title><defs><pattern id="cd-07" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="rgba(22,20,18,0.08)"/></pattern><clipPath id="art-07"><rect x="20" y="20" width="520" height="154" rx="4"/></clipPath></defs><style>
