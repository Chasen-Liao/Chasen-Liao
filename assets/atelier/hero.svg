<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t"><title id="t">Chasen Atelier — ASCII 艺术签名与个人展览封面</title><defs><pattern id="h-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="rgba(22,20,18,0.08)"/></pattern><pattern id="h-tone" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(24)"><circle cx="4.5" cy="4.5" r="1.7" fill="#D94426"/></pattern><clipPath id="h-clip"><rect x="6" y="6" width="1188" height="458" rx="6"/></clipPath></defs><style>
  .pulse { animation: pulse 3.2s ease-in-out infinite; }
  .spin-slow { transform-box: fill-box; transform-origin: center; animation: spin 46s linear infinite; }
  .spin-rev { transform-box: fill-box; transform-origin: center; animation: spinRev 64s linear infinite; }
  .scan-y { animation: scanY 5.2s ease-in-out infinite; }
  .flow-x { stroke-dasharray: 6 7; animation: flowX 4s linear infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.42; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.06); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinRev { to { transform: rotate(-360deg); } }
  @keyframes scanY { 0%, 100% { transform: translateY(0px); opacity: 0.35; } 50% { transform: translateY(82px); opacity: 0.85; } }
  @keyframes flowX { to { stroke-dashoffset: -26; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
    <rect x="6" y="6" width="1188" height="458" rx="6" fill="#F7F3EB" stroke="#181614" stroke-width="1.5"/>
    <g clip-path="url(#h-clip)">
      <rect x="6" y="6" width="1188" height="458" fill="url(#h-dots)"/>
      <!-- Architectural blueprint framing lines -->
      <line x1="6" y1="68" x2="1194" y2="68" stroke="#D5CDC0" stroke-width="1"/>
      <line x1="6" y1="354" x2="1194" y2="354" stroke="#D5CDC0" stroke-width="1"/>
      <line x1="600" y1="354" x2="600" y2="464" stroke="#D5CDC0" stroke-width="1"/>
      <line x1="215" y1="68" x2="215" y2="354" stroke="#D5CDC0" stroke-width="0.8" stroke-dasharray="3 5"/>
      <line x1="985" y1="68" x2="985" y2="354" stroke="#D5CDC0" stroke-width="0.8" stroke-dasharray="3 5"/>

      <!-- Risograph offset sun + halftone texture + orbital compass behind signature -->
      <g transform="translate(835 208)">
        <circle r="118" fill="rgba(217,68,38,0.13)"/>
        <circle r="118" fill="url(#h-tone)" opacity="0.24"/>
        <circle cx="-8" cy="6" r="118" fill="none" stroke="#D94426" stroke-width="1" opacity="0.45"/>
        <g class="spin-slow">
          <circle r="154" fill="none" stroke="#1D4E89" stroke-width="1.1" stroke-dasharray="6 9" opacity="0.48"/>
          <circle cx="0" cy="-154" r="3.5" fill="#1D4E89" opacity="0.75"/>
          <circle cx="154" cy="0" r="2.5" fill="#D94426" opacity="0.75"/>
        </g>
        <g class="spin-rev">
          <circle r="184" fill="none" stroke="#D5CDC0" stroke-width="1" stroke-dasharray="2 12"/>
        </g>
      </g>

      <!-- Subtle left blueprint coordinate crosshairs -->
      <g stroke="#1D4E89" stroke-width="0.9" opacity="0.28" fill="none">
        <circle cx="145" cy="212" r="54"/>
        <path d="M80 212H210M145 147V277"/>
      </g>
    </g>

    <g stroke="#8A8175" stroke-width="1" fill="none" opacity="0.65">
    <path d="M18 27V18H27M1173 18H1182V27M18 443V452H27M1173 452H1182V443"/>
  </g>

    <!-- Top Exhibition Masthead -->
    <g font-family="'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2">
      <rect x="44" y="29" width="8" height="8" fill="#D94426"/>
      <text x="64" y="38" fill="#161412" font-weight="700">EXHIBITION NO. 01</text>
      <text x="234" y="38" fill="#635C53">CHASEN ATELIER  ·  RISO-EDITION</text>
      <text x="904" y="38" text-anchor="end" fill="#635C53">GUANGZHOU / SHENZHEN</text>
      <circle cx="932" cy="34" r="4.5" fill="#D94426" class="pulse" style="transform-box:fill-box;transform-origin:center;"/>
      <text x="1154" y="38" text-anchor="end" fill="#161412" font-weight="600">ARCHIVE · 2026</text>
    </g>

    <!-- Preserved Chasen ASCII Signature as centerpiece -->
    <text xml:space="preserve" text-anchor="middle" font-family="'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="27" font-weight="700" fill="#D94426" opacity="0.24"><tspan x="600.6" y="151.8">   ____   _                                   </tspan><tspan x="600.6" y="181.8">  / ___| | |__    __ _   ___    ___   _ __    </tspan><tspan x="600.6" y="211.8"> | |     | '_ \  / _` | / __|  / _ \ | '_ \   </tspan><tspan x="600.6" y="241.8"> | |___  | | | || (_| | \__ \ |  __/ | | | |  </tspan><tspan x="600.6" y="271.8">  \____| |_| |_| \__,_| |___/  \___| |_| |_|  </tspan></text><text xml:space="preserve" text-anchor="middle" font-family="'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="27" font-weight="700" fill="#1D4E89" opacity="0.2"><tspan x="595.8" y="148.8">   ____   _                                   </tspan><tspan x="595.8" y="178.8">  / ___| | |__    __ _   ___    ___   _ __    </tspan><tspan x="595.8" y="208.8"> | |     | '_ \  / _` | / __|  / _ \ | '_ \   </tspan><tspan x="595.8" y="238.8"> | |___  | | | || (_| | \__ \ |  __/ | | | |  </tspan><tspan x="595.8" y="268.8">  \____| |_| |_| \__,_| |___/  \___| |_| |_|  </tspan></text><text xml:space="preserve" text-anchor="middle" font-family="'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="27" font-weight="700" fill="#161412" opacity="1"><tspan x="598" y="150">   ____   _                                   </tspan><tspan x="598" y="180">  / ___| | |__    __ _   ___    ___   _ __    </tspan><tspan x="598" y="210"> | |     | '_ \  / _` | / __|  / _ \ | '_ \   </tspan><tspan x="598" y="240"> | |___  | | | || (_| | \__ \ |  __/ | | | |  </tspan><tspan x="598" y="270">  \____| |_| |_| \__,_| |___/  \___| |_| |_|  </tspan></text>
    <text x="600" y="322" text-anchor="middle" font-family="'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="4.5" fill="#635C53">AI PRODUCT MANAGER  ×  AGENT ENGINEER</text>

    <!-- Vermilion Chop Seal on right margin -->
    <g transform="translate(1088 184)">
    <rect x="0" y="0" width="48" height="48" rx="4" fill="none" stroke="#D94426" stroke-width="1.8"/>
    <rect x="3.5" y="3.5" width="41" height="41" rx="2" fill="rgba(217,68,38,0.13)" stroke="#D94426" stroke-width="0.7" opacity="0.85"/>
    <path d="M24 6V42M6 24H42" stroke="#D94426" stroke-width="0.7" opacity="0.35"/>
    <text x="24" y="20.5" text-anchor="middle" font-family="'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#D94426">CL</text>
    <text x="24" y="35.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Segoe UI',sans-serif" font-size="10.5" font-weight="700" fill="#D94426">造物</text>
  </g>

    <!-- Bottom Curatorial Statement (2 Columns) -->
    <text x="46" y="392" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#161412">把想法锻造成真实产品与工具。</text>
    <text x="46" y="424" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Segoe UI',sans-serif" font-size="14.5" fill="#635C53">聚焦 Agent 工作流、桌面端体验与 Context Engineering，在实测与开源中持续交付。</text>

    <text x="1154" y="391" text-anchor="end" font-family="Georgia,'Times New Roman','Noto Serif SC',serif" font-size="16" font-style="italic" fill="#3B352F">“When wits fall short, repetition is the key to triumph.”</text>
    <g font-family="'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.6" fill="#1D4E89">
      <text x="1154" y="424" text-anchor="end">AGENTS  ·  ELECTRON  ·  SKILLS  ·  RAG</text>
    </g>
  </svg>